    title: Rijoy Mukherjee
    subtitle: "<p style='text-align: justify;'>I am currently a <strong>Staff R&amp;D Engineer</strong> at <a href='https://www.synopsys.com/' style='text-decoration: underline;'><strong>Synopsys</strong></a>, part of the <strong>VC Formal R&amp;D</strong> team, working specifically on the application of generative AI for next-gen formal verification of hardware.
                Prior to joining Synopsys, I completed my <strong>Ph.D.</strong> from the <a href='https://cse.iitkgp.ac.in/' style='text-decoration: underline;'><strong>Dept of CSE</strong></a> at <a href='https://www.iitkgp.ac.in/' style='text-decoration: underline;'><strong>IIT Kharagpur,</strong></a> advised by <a href='https://sites.google.com/site/rschakraborty/' style='text-decoration: underline;'><strong>Prof. Rajat Subhra Chakraborty.</strong></a>
                I was awarded the <a href='https://pmrf.in/' style='text-decoration: underline;'><strong>Prime Minister Research Fellowship (PMRF)</strong></a> during my Ph.D. tenure.
                My research focuses on exploring <strong>generative AI</strong> methodologies for advancing <strong>electronic design automation (EDA)</strong> workflows. I am particularly interested in leveraging <strong>large language models (LLMs)</strong> to aid and automate various computer-aided design tasks, including <strong>hardware design</strong> and <strong>verification</strong>.</p>"
