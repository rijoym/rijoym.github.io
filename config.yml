  description: "I completed my Ph.D. in Computer Science and Engineering from [Department of Computer Science and Engineering](https://cse.iitkgp.ac.in/) at [IIT Kharagpur](https://www.iitkgp.ac.in/), advised by Prof. [Rajat Subhra Chakraborty](https://sites.google.com/site/rschakraborty/)."
